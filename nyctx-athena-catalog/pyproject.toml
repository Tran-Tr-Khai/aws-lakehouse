[project]
name = 'nyctx-athena-catalog'
version = '0.1.0'
description = 'Athena catalog helpers and validation CLI for NYC Taxi analytics'
readme = 'README.md'
requires-python = '>=3.11,<3.14'
dependencies = [
    'boto3>=1.34,<2',
    'PyYAML>=6.0,<7',
]

[project.scripts]
nyctx-athena-run = 'nyctx_athena_catalog.cli:run_sql_main'
nyctx-athena-validate = 'nyctx_athena_catalog.cli:validate_partitions_main'

[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[tool.hatch.build.targets.wheel]
packages = ['src/nyctx_athena_catalog']

[dependency-groups]
dev = [
    'pytest>=8.3,<9',
]

[tool.pytest.ini_options]
addopts = '-ra'
testpaths = ['tests']
