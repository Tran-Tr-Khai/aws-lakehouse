[project]
name = "nyctx-glue-processor"
version = "0.1.0"
description = "AWS Glue PySpark jobs for NYC Taxi Silver transformations"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nyctx_glue_processor"]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
